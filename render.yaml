services:
  # Servicio NestJS Backend
  - type: web
    name: vacacional-api
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps --include=dev && npx prisma generate && npm run build -- --skipLibCheck
    startCommand: npx prisma generate && npx prisma migrate deploy && npm run start:prod
    repo: https://github.com/mauroociappinaph/plataformaaljojamientoback
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: vacacional-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: FRONTEND_URL
        value: https://plataformaaljojamientofront-59q3bkwx1.vercel.app/
      - key: CORS_ORIGIN
        value: https://plataformaaljojamientofront-59q3bkwx1.vercel.app/

# Base de datos PostgreSQL
databases:
  - name: vacacional-db
    plan: free
    ipAllowList: []
